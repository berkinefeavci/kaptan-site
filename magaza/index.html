<style>
/* Lacivert sahne, telefon öncelikli. Liste: dev başlık + cam sekme + raf kartları. Ürün: dev yazıların arasından geçen ürün, boylar ray üstünde kayar. */
:root {
	color-scheme: dark;
	--zemin: #040913; --zemin-ust: #10223e; --yuzey: rgb(160 190 235 / 0.07); --yuzey-2: rgb(160 190 235 / 0.12);
	--yazi: #eef2f8; --yazi-2: rgb(222 231 244 / 0.7); --yazi-3: rgb(222 231 244 / 0.45); --cizgi: rgb(200 220 255 / 0.12);
	--buz: #c6d8f0; --buz-koyu: #8fb3e0; --kirmizi: #e5392b; --tabak: #e8eef7; --tabak-2: #c9d6e8; --murekkep: #0b1a30;
	--baslik: "Urbanist", "Geist", system-ui, sans-serif; --govde: "Geist", system-ui, sans-serif;
	--yay: cubic-bezier(0.16, 1, 0.3, 1); --egri: cubic-bezier(0.22, 0.8, 0.22, 1);
	--kenar: 16px; --en: 1320px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; scrollbar-width: none; }
*::-webkit-scrollbar { display: none; }
html { background: var(--zemin); }
[hidden] { display: none !important; }
body { margin: 0; color: var(--yazi); font: 15px/1.5 var(--govde); -webkit-font-smoothing: antialiased; overflow-x: hidden; min-height: 100vh;
	background: radial-gradient(120% 620px at 60% 240px, var(--zemin-ust) 0%, #08142a 48%, var(--zemin) 100%) no-repeat, var(--zemin); }
a { color: inherit; text-decoration: none; }
button, input { font: inherit; color: inherit; background: none; border: 0; padding: 0; }
button { cursor: pointer; }
.ti { display: inline-grid; place-items: center; font-style: normal; }
.ti svg { width: 1em; height: 1em; display: block; }
:focus-visible { outline: 2px solid var(--buz); outline-offset: 3px; }
.kap { max-width: var(--en); margin: 0 auto; padding-inline: var(--kenar); }

/* Liquid glass (hafif sürüm): buzlu zemin, sol üstte ışık yansıması, içte ince halka */
.cam, .notlar .not { position: relative; isolation: isolate;
	background: linear-gradient(135deg, rgb(255 255 255 / 0.2), rgb(255 255 255 / 0.05) 38%, rgb(255 255 255 / 0.02) 62%, rgb(255 255 255 / 0.09));
	backdrop-filter: blur(22px) saturate(1.8) brightness(1.08); -webkit-backdrop-filter: blur(22px) saturate(1.8) brightness(1.08);
	box-shadow: inset 1.5px 1.5px 0 -0.5px rgb(255 255 255 / 0.55), inset -1px -1px 0 rgb(255 255 255 / 0.1), inset 0 0 0 1px rgb(220 232 255 / 0.14),
		inset 0 -10px 22px -10px rgb(150 190 255 / 0.28), 0 14px 34px -14px rgb(0 0 0 / 0.85); }
.cam::before, .notlar .not::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: -1;
	background: radial-gradient(90% 55% at 28% 0%, rgb(255 255 255 / 0.28), transparent 60%), radial-gradient(60% 40% at 80% 110%, rgb(160 200 255 / 0.16), transparent 70%); }
.bas { transition: scale 0.3s var(--yay); }
.bas:active { scale: 0.95; }

/* Üst şerit */
.ust { position: relative; z-index: 6; display: grid; grid-template-columns: minmax(92px, 1fr) auto minmax(92px, 1fr); align-items: center; gap: 8px; height: 64px; }
.geri { grid-column: 1; grid-row: 1; justify-self: start; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; color: var(--buz); flex: none; }
.marka { grid-column: 2; grid-row: 1; display: flex; align-items: center; justify-content: center; gap: 9px; min-width: 0; }
.marka img { width: 30px; height: auto; flex: none; }
.marka .ad { font: 400 19px/1.25 var(--baslik); letter-spacing: -0.005em; white-space: nowrap; color: var(--yazi); }
.ust .sag { grid-column: 3; grid-row: 1; justify-self: end; display: flex; gap: 8px; }
.ust .sag > * { position: relative; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; color: var(--buz); }

/* Dev yazı: satır maskesinden yükselir, harf harf değişir; boyu kutuya sığacak kadar (JS) */
.dev { margin: 0; font-family: var(--baslik); font-weight: 300; color: var(--buz); letter-spacing: -0.04em; line-height: 0.88; white-space: nowrap; width: max-content; max-width: none; }
.dev .satir { display: block; overflow: hidden; padding: 0.04em 0.06em 0.24em; margin: -0.04em -0.06em -0.24em; }
.dev .satir > span { display: block; }
.harf { display: inline-block; white-space: pre; }

/* ───────── Liste ───────── */
.l-bas { padding-block: 2px 10px; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 24px; overflow: hidden; }
.l-bas .dev { font-size: 52px; }
.l-meta { margin: 0; color: var(--yazi-2); font-size: 13.5px; }
.cubuk { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 8; padding-block: 8px; }
.cubuk-ic { display: grid; grid-template-columns: minmax(0, 1fr) 52px; gap: 8px; height: 52px; }
.sekme { border-radius: 999px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 4px; transition: opacity 0.3s var(--egri); }
.sekme i.gosterge { position: absolute; z-index: -1; left: 4px; top: 4px; bottom: 4px; width: calc((100% - 8px) / 3); border-radius: 999px; background: rgb(198 216 240 / 0.2);
	box-shadow: inset 1px 1px 0 rgb(255 255 255 / 0.5), inset 0 0 0 1px rgb(220 232 255 / 0.22); transition: transform 0.55s var(--yay); }
.sekme button { border-radius: 999px; font-size: 14px; color: var(--yazi-2); display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 0; transition: color 0.3s; }
.sekme button[aria-selected="true"] { color: var(--yazi); }
.sekme button small { font-size: 11px; color: var(--yazi-3); font-variant-numeric: tabular-nums; }
.ara-dugme { border-radius: 50%; display: grid; place-items: center; font-size: 20px; color: var(--buz); }
.ara-kutu { position: absolute; inset: 0 var(--kenar); right: calc(var(--kenar) + 60px); border-radius: 999px; display: flex; align-items: center; gap: 10px; padding: 0 18px;
	opacity: 0; pointer-events: none; scale: 0.96 1; transform-origin: right; transition: opacity 0.3s var(--egri), scale 0.45s var(--yay); }
.ara-kutu input { flex: 1; min-width: 0; height: 100%; outline: 0; font-size: 16px; }
.ara-kutu input::placeholder { color: var(--yazi-3); }
.ara-acik .ara-kutu { opacity: 1; pointer-events: auto; scale: 1 1; }
.ara-acik .sekme { opacity: 0; pointer-events: none; }
.cubuk { position: sticky; }
.cubuk .kap { position: relative; }

.altlar { display: flex; gap: 8px; overflow-x: auto; padding-block: 6px 4px; margin-inline: calc(-1 * var(--kenar)); padding-inline: var(--kenar); }
.altlar button { flex: none; height: 38px; padding: 0 16px; border-radius: 999px; font-size: 13.5px; color: var(--yazi-2); background: var(--yuzey); box-shadow: inset 0 0 0 1px var(--cizgi); transition: color 0.3s, background 0.3s, box-shadow 0.3s, scale 0.3s var(--yay); }
.altlar button:active { scale: 0.95; }
.altlar button[aria-pressed="true"] { color: var(--murekkep); background: var(--buz); box-shadow: none; }

.izgara { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding-block: 12px 56px; }
.bos { grid-column: 1 / -1; padding: 48px 0; text-align: center; color: var(--yazi-2); }

/* Raf kartı: bir söndürücü ailesi; tüp solda ayakta, boylar kartın içinde seçilir */
.aile { grid-column: 1 / -1; position: relative; height: 196px; border-radius: 30px; overflow: hidden; display: grid; grid-template-columns: 34% minmax(0, 1fr);
	background: linear-gradient(140deg, var(--yuzey-2), var(--yuzey) 55%); box-shadow: inset 1px 1px 0 rgb(255 255 255 / 0.16), inset 0 0 0 1px var(--cizgi); transition: scale 0.35s var(--yay); }
.aile:active { scale: 0.985; }
.aile .ana { position: absolute; inset: 0; z-index: 1; border-radius: inherit; }
.aile .resim { position: relative; }
.aile .resim::before { content: ""; position: absolute; left: 50%; bottom: 10px; width: 78%; height: 16px; translate: -50% 0; border-radius: 50%; background: radial-gradient(closest-side, rgb(0 0 0 / 0.7), transparent); }
.aile .resim img { position: absolute; left: 50%; bottom: 14px; height: calc(100% - 26px); max-width: none; translate: -50% 0; filter: drop-shadow(0 12px 14px rgb(0 0 0 / 0.5)); }
.aile .govde { padding: 18px 16px 14px 4px; display: grid; grid-template-rows: auto auto 1fr auto; min-width: 0; }
.aile h3 { margin: -4px 0 -5px; padding: 0 2px 0 0; font: 300 27px/1.35 var(--baslik); letter-spacing: -0.02em; color: var(--buz); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.aile .siniflar { display: flex; gap: 5px; margin-top: 9px; }
.aile .siniflar b { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 7px; display: grid; place-items: center; font: 500 11px/1 var(--govde); color: var(--murekkep); background: var(--buz); }
.aile .siniflar span { height: 22px; display: grid; place-items: center; font-size: 12px; color: var(--yazi-3); margin-left: 3px; white-space: nowrap; overflow: hidden; }
.aile p { margin: 9px 0 0; font-size: 13px; line-height: 1.35; color: var(--yazi-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; align-self: start; }
.aile .alt { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.aile .boy { position: relative; z-index: 2; display: flex; gap: 5px; overflow-x: auto; margin-left: -4px; padding-left: 4px;
	-webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 18px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 18px), transparent); }
.aile .boy a { flex: none; min-width: 36px; height: 36px; padding: 0 9px; border-radius: 999px; display: grid; place-items: center; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--yazi);
	background: rgb(198 216 240 / 0.1); box-shadow: inset 0 0 0 1px rgb(220 232 255 / 0.18); transition: scale 0.3s var(--yay), background 0.3s; }
.aile .boy a:active { scale: 0.9; background: rgb(198 216 240 / 0.26); }
.aile .boy em { font-style: normal; font-size: 12px; color: var(--yazi-3); align-self: center; padding: 0 14px 0 2px; flex: none; }
.aile .fiyat { font: 400 19px/1.2 var(--baslik); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.aile .fiyat small { display: block; font: 400 11px/1 var(--govde); color: var(--yazi-3); margin-bottom: 4px; }
.aile .fiyat small.dolum { margin: 6px 0 0; color: var(--yazi-2); font-variant-numeric: tabular-nums; }

/* Ürün kartı: sabit ölçü; ad en çok iki satır, künye tek satır */
.kart { position: relative; border-radius: 26px; padding: 8px 8px 14px; display: grid; grid-template-rows: auto 38px 17px 26px; row-gap: 0; min-width: 0;
	background: var(--yuzey); box-shadow: inset 0 0 0 1px var(--cizgi); transition: scale 0.35s var(--yay); }
.kart:active { scale: 0.97; }
.tabak { aspect-ratio: 1; border-radius: 18px; display: grid; place-items: center; overflow: hidden; margin-bottom: 12px; }
.tabak.acik { background: radial-gradient(90% 90% at 50% 35%, #fff, var(--tabak) 55%, var(--tabak-2)); }
.tabak.acik img { width: 78%; height: 78%; object-fit: contain; }
.tabak.koyu { background: radial-gradient(80% 80% at 50% 40%, rgb(120 160 225 / 0.22), transparent 70%); }
.tabak.koyu img { height: 92%; max-width: none; filter: drop-shadow(0 10px 12px rgb(0 0 0 / 0.5)); }
.tabak.ikon { background: radial-gradient(80% 80% at 50% 40%, rgb(120 160 225 / 0.2), transparent 70%); font-size: 54px; color: var(--buz); }
.tabak.ikon .ti svg { stroke-width: 1; }
.kart h3 { margin: 0; padding: 0 6px; font: 400 14px/19px var(--govde); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; align-self: start; }
.kart .kunye { padding: 0 6px; font-size: 12px; line-height: 17px; color: var(--yazi-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kart .fiyat { padding: 0 6px; font: 400 19px/1 var(--baslik); font-variant-numeric: tabular-nums; align-self: end; }

.iletisim { border-top: 1px solid var(--cizgi); padding-block: 32px 48px; display: grid; gap: 28px; color: var(--yazi-2); font-size: 14px; }
.iletisim .logo { grid-column: 1 / -1; display: grid; gap: 10px; justify-items: center; text-align: center; }
.iletisim .logo img { width: 44px; height: auto; }
.iletisim .logo p { margin: 0; font: 400 20px/1.25 var(--baslik); color: var(--yazi); }
.iletisim b { display: block; font: 400 22px/1.1 var(--baslik); color: var(--buz); margin-bottom: 8px; }
.iletisim span { display: block; user-select: all; }
.iletisim .yasal { font-size: 12.5px; color: var(--yazi-3); margin: 0; max-width: 60ch; }

/* ───────── Ürün sahnesi ───────── */
.sahne { position: relative; height: clamp(620px, calc(100svh - 64px), 760px); overflow-x: clip; overflow-y: visible; margin-inline: calc(-1 * var(--kenar)); touch-action: pan-y; }
.sahne .dev { position: absolute; pointer-events: none; }
.sahne .dev .satir > span { transform: translateY(104%); transition: transform 1.2s var(--yay); }
.hazir .dev .satir > span { transform: none; }
.dev.sol { left: var(--kenar); top: 4px; font-size: 56px; }
.dev.sol .satir { display: inline-block; vertical-align: top; } .dev.sol .satir + .satir { margin-left: 0.16em; }
.dev.sol .satir:nth-child(1) > span { transition-delay: 0.25s; }
.dev.sol .satir:nth-child(2) > span { transition-delay: 0.33s; }
.dev.sag { left: 0; right: 0; margin-inline: auto; top: 200px; font-size: 130px; text-align: center; }
.dev.sag .harf.bosluk { width: var(--bosluk, auto); }
/* telefon/tablet: sayı tüpün arkasında kocaman, birim (kg) ayrı katmanda tüpün önünde ve küçük (Berkin 2026-10-06) */
.dev.sag .harf.yok { display: none; }
.dev.birim { display: none; z-index: 4; font-weight: 400; letter-spacing: -0.02em; line-height: 1; opacity: 0; transition: opacity 0.9s var(--egri) 0.6s; }
.sahne.ayri-kilo .dev.birim { display: block; } .hazir .dev.birim { opacity: 1; }
.dev.sag .satir > span { transition-delay: 0.45s; }

.isik::after { content: ""; position: absolute; left: 50%; top: 100%; width: 520px; height: 420px; translate: -50% -30%; border-radius: 50%; background: radial-gradient(closest-side, rgb(120 160 225 / 0.1), transparent); }
.isik { position: absolute; left: 50%; top: 56%; width: 300px; height: 380px; translate: -50% -50%; border-radius: 50%; pointer-events: none;
	background: radial-gradient(closest-side, rgb(120 160 225 / 0.2), transparent); filter: blur(20px); opacity: 0; transition: opacity 1.6s var(--egri) 0.2s; }
.hazir .isik { opacity: 1; }
.golge { position: absolute; left: 50%; bottom: 22.5%; width: 200px; height: 36px; translate: -50% 0; border-radius: 50%; background: radial-gradient(closest-side, rgb(0 0 0 / 0.85), transparent); }

.urun { position: absolute; left: 50%; bottom: 24%; aspect-ratio: 2 / 3; translate: -50% 0; perspective: 1100px; transition: height 0.95s cubic-bezier(0.65, 0, 0.35, 1); }
.urun.kare { aspect-ratio: 1; bottom: 27%; left: 50%; }
.sahne:has(.urun.kare) .golge { display: none; }
.dondur { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform 0.7s var(--egri); }
.acilis { position: absolute; inset: 0; transform: translateY(70%); opacity: 0; transition: transform 1.4s var(--yay) 0.1s, opacity 0.9s var(--egri) 0.1s; }
.hazir .acilis { transform: none; opacity: 1; }
.vt .acilis { transition: none; }
.katman { position: absolute; inset: 0; will-change: transform, opacity; display: grid; place-items: center; }
.katman img { width: 100%; height: 100%; object-fit: contain; display: block; filter: drop-shadow(0 34px 34px rgb(0 0 0 / 0.55)); }
.katman.tabakli { border-radius: 50%; background: radial-gradient(90% 90% at 50% 32%, #fff, var(--tabak) 55%, var(--tabak-2)); box-shadow: 0 30px 60px -20px rgb(0 0 0 / 0.8), inset 0 -14px 30px -10px rgb(11 26 48 / 0.25); }
.katman.tabakli img { width: 66%; height: 66%; filter: none; }
.katman.ikonlu { border-radius: 50%; font-size: 42cqw; color: var(--buz); }
.katman.ikonlu .ti { font-size: 110px; }
.katman.ikonlu .ti svg { stroke-width: 0.8; }

/* Tüpün üstündeki cam kapsüller: tüpün önünde durur ki 3B dönüşte tüp fareyi yutmasın */
.nokta { position: absolute; z-index: 4; width: 0; height: 0; opacity: 0; transform: translateZ(60px); transition: opacity 0.6s var(--egri); }
.goster .nokta { opacity: 1; }
.nokta .dugum { position: absolute; left: -13px; top: -13px; width: 26px; height: 26px; border-radius: 50%; z-index: 2; display: grid; place-items: center; font-size: 13px; color: var(--murekkep);
	background: radial-gradient(circle at 35% 30%, #fff, var(--buz) 70%); box-shadow: 0 0 0 4px rgb(198 216 240 / 0.16), 0 6px 16px rgb(0 0 0 / 0.4); transition: transform 0.4s var(--yay); }
.nokta .kapsul { position: absolute; top: -40px; white-space: nowrap; padding: 9px 16px 9px 24px; border-radius: 999px; font-size: 13px; color: var(--buz); transition: color 0.3s, background 0.3s, box-shadow 0.3s; }
.nokta.sag .kapsul { left: -4px; }
.nokta.sol .kapsul { right: -4px; padding: 9px 24px 9px 16px; }
.nokta.sol { display: none; }
.nokta .kapsul { opacity: 0; } .nokta.acik .kapsul { opacity: 1; }
.nokta.acik .kapsul, .nokta:focus-visible .kapsul { color: var(--yazi); background-color: rgb(198 216 240 / 0.16); box-shadow: inset 1.5px 1.5px 0 -0.5px rgb(255 255 255 / 0.7), inset 0 0 0 1px rgb(220 232 255 / 0.4), 0 0 28px -4px rgb(150 190 255 / 0.45); }
/* fare tepkileri yalnız faresi olan cihazda; telefonda dokunuş hover'ı tetikleyip takılı bırakmasın */
@media (hover: hover) { .nokta:hover .kapsul { opacity: 1; } .nokta:hover .kapsul { color: var(--yazi); background-color: rgb(198 216 240 / 0.16); box-shadow: inset 1.5px 1.5px 0 -0.5px rgb(255 255 255 / 0.7), inset 0 0 0 1px rgb(220 232 255 / 0.4), 0 0 28px -4px rgb(150 190 255 / 0.45); } .nokta:hover .dugum { transform: scale(1.15); } .kart:hover, .aile:hover { scale: 0.99; } .al:hover { scale: 0.97; } }

.not-temsili { display: none; }
/* telefon: açıklama başlığın altında, bilgi etiketleri tüpün altında cam hap olarak */
.sag-yazi { position: absolute; left: var(--kenar); top: 68px; width: min(76%, 320px); margin: 0; font-size: 13.5px; line-height: 1.4; color: var(--yazi-2); }
.notlar { position: absolute; z-index: 3; left: 0; right: 0; bottom: calc(3.5% + 66px); display: flex; justify-content: center; gap: 8px; padding-inline: var(--kenar); opacity: 0; transition: opacity 0.9s var(--egri) 1.1s; }
.hazir .notlar { opacity: 1; }
.not { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 12px; border-radius: 999px; font-size: 12.5px; white-space: nowrap; color: var(--yazi); min-width: 0; }
.not .simge { display: grid; place-items: center; font-size: 17px; color: var(--buz); }
.not p { margin: 0; }
.not .uz { display: none; }
@media (max-width: 1179.98px) { .notlar .not .simge.cam { background: none; backdrop-filter: none; -webkit-backdrop-filter: none; box-shadow: none; } .notlar .not .simge.cam::before { display: none; } }
.al { position: absolute; z-index: 3; right: var(--kenar); bottom: 24%; width: 108px; height: 108px; border-radius: 50%; display: grid; place-items: center; align-content: center; gap: 4px;
	opacity: 0; scale: 0.8; transition: opacity 0.8s var(--egri) 1.1s, scale 1s var(--yay) 1.1s; }
.hazir .al { opacity: 1; scale: 1; }
.hazir .al:active { scale: 0.93; transition-delay: 0s; transition-duration: 0.3s; }
.al .ti { font-size: 18px; color: var(--buz); }
.al small { font-size: 11px; line-height: 1; color: var(--yazi-2); }
.al b { font: 400 20px/1 var(--baslik); letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.puskurt { position: absolute; z-index: 3; right: var(--kenar); bottom: calc(24% + 122px); height: 44px; padding: 0 16px 0 13px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px;
	font: 400 14px/1 var(--baslik); color: var(--yazi); opacity: 0; transition: opacity 0.8s var(--egri) 1.2s, scale 0.3s var(--yay); }
.hazir .puskurt { opacity: 1; }
.puskurt:active { scale: 0.94; }
.puskurt .ti { font-size: 18px; color: var(--buz); }
.duman { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
.perde { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 50; }

.boylar { position: absolute; z-index: 3; left: 0; right: 0; bottom: 3.5%; margin-inline: auto; width: max-content; display: flex; align-items: center; gap: 10px;
	opacity: 0; translate: 0 12px; transition: opacity 0.8s var(--egri) 1.3s, translate 0.8s var(--yay) 1.3s; }
.hazir .boylar { opacity: 1; translate: 0 0; }
.boylar .ok { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 17px; color: var(--buz); transition: scale 0.3s var(--yay), opacity 0.3s; }
.boylar .ok:active { scale: 0.9; }
.boylar .ok:disabled { opacity: 0.35; cursor: default; }
.boylar .sayfa { height: 50px; padding: 0 16px; border-radius: 999px; display: flex; align-items: center; }
.boylar .sayfa button { width: 22px; height: 50px; display: grid; place-items: center; transition: width 0.5s var(--yay); }
.boylar .sayfa button::before { content: ""; width: 9px; height: 9px; border-radius: 999px; background: rgb(222 231 244 / 0.34); transition: width 0.5s var(--yay), background 0.3s; }
.boylar .sayfa button[aria-pressed="true"] { width: 42px; }
.boylar .sayfa button[aria-pressed="true"]::before { width: 30px; background: var(--buz); }

/* Bilgi bölümleri */
.bilgi { padding-block: 28px 120px; display: grid; gap: 64px; }
.giris { margin: 0; font: 300 23px/1.25 var(--baslik); letter-spacing: -0.01em; color: var(--yazi); text-wrap: balance; }
.giris span { color: var(--yazi-2); }
.olculer { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 20px; }
.olcu { position: relative; padding: 18px 0; display: grid; gap: 6px; align-content: start; min-width: 0; }
.olcu b { padding: 0 2px 0.14em 0; font: 300 40px/1.1 var(--baslik); color: var(--buz); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.olcu span { color: var(--yazi-2); font-size: 13.5px; }
.bolum { display: grid; gap: 24px; }
.bolum h2 { margin: 0; font: 300 46px/0.95 var(--baslik); letter-spacing: -0.035em; color: var(--buz); }
.adimlar { display: grid; gap: 0; }
.adim { position: relative; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 4px 0; padding: 18px 0; }
.olcu::before, .adim::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: var(--cizgi); transform-origin: left; transition: transform 1.2s var(--yay); transition-delay: var(--g, 0ms); }
.adim i { grid-row: span 2; font: 400 14px/1.6 var(--baslik); font-style: normal; color: var(--buz-koyu); letter-spacing: 0.08em; }
.adim b { font: 400 21px/1.2 var(--baslik); }
.adim span { color: var(--yazi-2); font-size: 14.5px; }
.alanlar { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 20px; }
.alanlar div { display: flex; align-items: center; gap: 12px; padding: 15px 0; border-bottom: 1px solid var(--cizgi); font: 400 17px/1.2 var(--baslik); min-width: 0; }
.alanlar .ti { font-size: 21px; color: var(--buz-koyu); flex: none; }
.uyari { margin: 24px 0 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; color: var(--yazi-2); font-size: 14.5px; }
.uyari .ti { font-size: 20px; color: var(--kirmizi); margin-top: 1px; }
.uyari b { color: var(--yazi); font-weight: 500; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
td { padding: 15px 0; border-top: 1px solid var(--cizgi); vertical-align: top; }
td:first-child { color: var(--yazi-3); width: 42%; padding-right: 12px; }
td.bos { color: var(--yazi-3); font-style: italic; }
.serit { display: grid; grid-auto-flow: column; grid-auto-columns: 156px; gap: 12px; overflow-x: auto; scroll-snap-type: x proximity; margin-inline: calc(-1 * var(--kenar)); padding-inline: var(--kenar); scroll-padding-inline: var(--kenar); }
.serit .kart { scroll-snap-align: start; }

/* Tüp gövde etiketi (Berkin 2026-10-06): görseller etiketsiz, temiz gazlı ile KKT aynı görünüyordu. Her türün kendi renk bandı + büyük madde kodu.
   Konum uygulamadaki tüp kartıyla aynı gövde ölçüsünden (TupSahnesi GOVDE); yazılar etiketin genişliğine oranlı (cqw). */
.tupcuk { position: relative; display: block; aspect-ratio: 2 / 3; }
.tupcuk img { display: block; width: 100%; height: 100%; }
.aile .resim .tupcuk { position: absolute; left: 50%; bottom: 14px; height: calc(100% - 26px); translate: -50% 0; }
.aile .resim .tupcuk img { position: static; translate: none; height: 100%; }
.tabak.koyu .tupcuk { height: 92%; } .tabak.koyu .tupcuk img { height: 100%; width: 100%; }
.satir-s .tabak.koyu .tupcuk { height: 50px; } .satir-s .tabak.koyu .tupcuk img { height: 100%; width: 100%; }
.etiket { position: absolute; left: var(--x); top: var(--t); width: var(--w); translate: -50% 0; rotate: var(--a); container-type: inline-size; overflow: hidden;
	display: grid; justify-items: center; border-radius: 5% / 4%; background: #f3efe6; color: #1a1d24; pointer-events: none; user-select: none; }
.etiket::after { content: ""; position: absolute; inset: 0; pointer-events: none;
	background: linear-gradient(90deg, rgb(40 8 8 / 0.42), transparent 22%, rgb(255 255 255 / 0.14) 44%, transparent 64%, rgb(40 8 8 / 0.48)); }
.etiket i { justify-self: stretch; padding: 3.4cqw 0 3cqw; background: var(--renk); color: var(--bant-yazi, #fff); text-align: center; font: 600 6.4cqw/1 var(--govde); font-style: normal; letter-spacing: 0.12em; text-transform: uppercase; }
.etiket b { margin-top: 6cqw; font: 700 var(--kf)/0.95 var(--baslik); letter-spacing: -0.02em; white-space: nowrap; }
.etiket > span { margin-top: 2.4cqw; font: 500 8.4cqw/1.1 var(--govde); color: #4b515d; white-space: nowrap; }
/* cqw yalnız iç elemanlarda: etiketin kendi kutusunda cqw sayfaya göre çözülür */
.etiket em { display: flex; align-items: center; gap: 2.2cqw; margin: 5.5cqw 0 6cqw; font-style: normal; }
.etiket u { display: grid; place-items: center; width: 11cqw; height: 11cqw; border: 0.7cqw solid currentColor; border-radius: 2cqw; text-decoration: none; font: 700 7.4cqw/1 var(--govde); }
.etiket s { margin-left: 2cqw; text-decoration: none; font: 700 10cqw/1 var(--baslik); white-space: nowrap; }
/* Alt çubuk: fiyat dairesi ekrandan çıkınca gelir */
.alt-cubuk { position: fixed; z-index: 20; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); max-width: 520px; margin-inline: auto; height: 64px; border-radius: 999px; padding: 0 8px 0 22px;
	display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; translate: 0 140%; transition: translate 0.6s var(--yay); background-color: rgb(8 20 42 / 0.72); }
.alt-cubuk.acik { translate: 0 0; }
.alt-cubuk div { min-width: 0; }
.alt-cubuk small { display: block; font-size: 12px; color: var(--yazi-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.alt-cubuk b { display: block; font: 400 21px/1.25 var(--baslik); font-variant-numeric: tabular-nums; }
.alt-cubuk button { height: 48px; padding: 0 20px 0 16px; border-radius: 999px; display: flex; align-items: center; gap: 8px; font-size: 14.5px; color: var(--murekkep); background: var(--buz); }
.alt-cubuk button .ti { font-size: 20px; }
.alt-cubuk button:active { scale: 0.95; }

/* Kaydırdıkça açılma: zamanla oynar (kaydırmaya bağlı değil). Gizli hâli yalnız JS kurar; bitince sınıflar kalkar.
   Varsayılan: aşağıdan, bulanıktan netliğe. sol: soldan. pop: küçükten büyüyerek. kart: sağdan dönerek. cizgi: önce çizgi çizilir, sonra içerik gelir. baslik: harf harf maskeden. */
.bk { opacity: 0; translate: 0 70px; scale: 0.93; filter: blur(8px); transition: opacity 0.7s ease-out, translate 1.15s var(--yay), scale 1.15s var(--yay), rotate 1.15s var(--yay), filter 0.8s ease-out; }
.bk[data-v="sol"] { translate: -64px 0; scale: 1; }
.bk[data-v="pop"] { translate: 0 30px; scale: 0.55; }
.bk[data-v="kart"] { translate: 90px 0; scale: 0.85; rotate: 5deg; }
.bk[data-v="cizgi"] { opacity: 1; translate: none; scale: 1; filter: none; }
.bk[data-v="cizgi"]::before { transform: scaleX(0); }
.bk[data-v="cizgi"] > * { opacity: 0; translate: 0 44px; filter: blur(7px); transition: opacity 0.7s ease-out, translate 1.1s var(--yay), filter 0.8s ease-out; transition-delay: calc(var(--g, 0ms) + 260ms); }
.bk[data-v="cizgi"] > :nth-child(2) { transition-delay: calc(var(--g, 0ms) + 360ms); }
.bk[data-v="cizgi"] > :nth-child(3) { transition-delay: calc(var(--g, 0ms) + 460ms); }
.bk.gor, .bk[data-v].gor { opacity: 1; translate: 0 0; scale: 1; rotate: 0deg; filter: blur(0); }
.bk.gor[data-v="cizgi"]::before { transform: none; }
.bk.gor[data-v="cizgi"] > * { opacity: 1; translate: 0 0; filter: blur(0); }
.hs { display: block; overflow: hidden; padding: 0.08em 0 0.3em; margin: -0.08em 0 -0.3em; }
.hc { display: inline-block; white-space: pre; }
.hbk .hc { transform: translateY(120%) rotate(9deg); transform-origin: left bottom; transition: transform 1.15s var(--yay); transition-delay: calc(var(--g, 0ms) + var(--s, 0) * 150ms + var(--c, 0) * 32ms); }
.hbk.gor .hc { transform: none; }

/* Sepet: telefonda alttan açılan sayfa, geniş ekranda sağdan gelen panel. Ödeme yok; liste WhatsApp mesajı olarak gider. */
.sepet-sayi { position: absolute; right: -3px; top: -3px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 999px; display: grid; place-items: center; font: 500 11px/1 var(--govde); font-variant-numeric: tabular-nums; color: #fff; background: var(--kirmizi); }
.sepet-perde { position: fixed; inset: 0; z-index: 39; background: rgb(2 6 14 / 0.6); opacity: 0; pointer-events: none; transition: opacity 0.4s var(--egri); }
.sepet-perde.acik { opacity: 1; pointer-events: auto; }
.sepet { position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; max-height: 86%; border-radius: 30px 30px 0 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; visibility: hidden;
	padding-bottom: env(safe-area-inset-bottom, 0px); background: rgb(9 21 43 / 0.88); backdrop-filter: blur(28px) saturate(1.6); -webkit-backdrop-filter: blur(28px) saturate(1.6);
	box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.22), inset 0 0 0 1px var(--cizgi), 0 -20px 60px -20px rgb(0 0 0 / 0.9); translate: 0 104%; transition: translate 0.6s var(--yay), visibility 0s 0.6s; }
.sepet.acik { translate: 0 0; visibility: visible; transition: translate 0.6s var(--yay); }
.sepet > header { display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 10px 22px; }
.sepet h2 { margin: 0; font: 300 34px/1.2 var(--baslik); letter-spacing: -0.03em; color: var(--buz); }
.sepet h2 small { font: 400 13px/1 var(--govde); letter-spacing: 0; color: var(--yazi-3); margin-left: 8px; }
.sepet-kapat { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-size: 19px; color: var(--buz); }
.sepet-liste { overflow-y: auto; padding: 0 22px; overscroll-behavior: contain; }
.sepet-bos { margin: 0; padding: 28px 0 40px; color: var(--yazi-2); font-size: 14.5px; max-width: 34ch; }
.sepet-firma { margin: 14px 0 0; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--yazi-3); }
.satir-s { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--cizgi); }
.satir-s .tabak { margin: 0; border-radius: 14px; width: 56px; height: 56px; } .satir-s .tabak.koyu img { height: 50px; width: auto; } .satir-s .tabak.acik img { width: 44px; height: 44px; } .satir-s .tabak.ikon { font-size: 26px; }
.satir-s h3 { margin: 0; font: 400 14px/1.3 var(--govde); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.satir-s span { font: 400 16px/1.4 var(--baslik); font-variant-numeric: tabular-nums; color: var(--yazi-2); }
.adet { display: grid; grid-template-columns: 34px 26px 34px; align-items: center; height: 38px; border-radius: 999px; background: var(--yuzey); box-shadow: inset 0 0 0 1px var(--cizgi); }
.adet button { height: 38px; display: grid; place-items: center; font-size: 15px; color: var(--buz); transition: scale 0.3s var(--yay); }
.adet button:active { scale: 0.8; }
.adet b { text-align: center; font: 400 15px/1 var(--govde); font-variant-numeric: tabular-nums; }
.sepet > footer { padding: 14px 22px 18px; display: grid; gap: 12px; }
.sepet-toplam { display: flex; align-items: baseline; justify-content: space-between; color: var(--yazi-2); font-size: 13.5px; }
.sepet-toplam b { font: 400 28px/1.2 var(--baslik); color: var(--yazi); font-variant-numeric: tabular-nums; }
.sepet-gonder { height: 54px; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15.5px; color: var(--murekkep); background: var(--buz); transition: scale 0.3s var(--yay); }
.sepet-gonder:active { scale: 0.97; }
.sepet-gonder .ti { font-size: 21px; }
.sepet-not { margin: 0; font-size: 12px; color: var(--yazi-3); }

/* Sayfa geçişi: karttaki görsel sahnedeki yerine uçar */
::view-transition-group(urun-gorsel) { animation-duration: 0.75s; animation-timing-function: cubic-bezier(0.65, 0, 0.2, 1); }
::view-transition-old(urun-gorsel), ::view-transition-new(urun-gorsel) { height: 100%; width: 100%; object-fit: contain; }
::view-transition-old(root) { animation: 0.3s var(--egri) both vt-cik; }
::view-transition-new(root) { animation: 0.5s var(--egri) 0.12s both vt-gir; }
@keyframes vt-cik { to { opacity: 0; } }
@keyframes vt-gir { from { opacity: 0; } }

/* ───────── Geniş ekran ───────── */
@media (min-width: 760px) {
	:root { --kenar: 40px; }
	.ust { height: 88px; }
	.l-bas { padding-block: 0 14px; }
	.cubuk-ic { grid-template-columns: minmax(0, 460px) 52px; }
	.ara-kutu { right: auto; width: 460px; }
	.izgara { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
	.aile { grid-column: span 2; height: 232px; }
	.aile h3 { font-size: 32px; }
	.iletisim { grid-template-columns: repeat(2, minmax(0, 1fr)); } .iletisim .yasal { grid-column: 1 / -1; }

	.sahne { height: clamp(640px, calc(100vh - 92px), 760px); }
	.al { width: 132px; height: 132px; } .al b { font-size: 24px; } .puskurt { bottom: calc(24% + 148px); height: 50px; font-size: 15.5px; }
	.sepet { left: auto; top: 12px; right: 12px; bottom: 12px; width: 420px; max-height: none; border-radius: 30px; padding-bottom: 0; translate: 108% 0; }
	.bilgi { padding-block: 56px 140px; gap: 96px; }
	.olculer { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 24px; }
	.olcu { padding-top: 26px; } .olcu b { font-size: 56px; }
	.bolum { grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap: 56px; align-items: start; }
	.bolum.tam { grid-template-columns: minmax(0, 1fr); gap: 32px; }
	.bolum h2 { font-size: 64px; }
	.adimlar { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 48px; }
	.alanlar { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 32px; } .alanlar div { font-size: 19px; }
	.serit { grid-auto-columns: 200px; gap: 16px; }
}
@media (min-width: 1180px) {
	.sahne { height: clamp(660px, calc(100vh - 92px), 820px); }
	.dev.sol { left: 9%; top: 5%; text-align: center; }
	.dev.sol .satir { display: block; } .dev.sol .satir + .satir { margin-left: 0; }
	.dev.sag { right: auto; left: 56%; margin-inline: 0; top: 38%; text-align: left; }
	.dev.sag .harf.bosluk { width: auto; }
	.urun, .isik, .golge { left: 47%; }
	.urun { bottom: 6%; } .urun.kare { bottom: 14%; left: 47%; }
	.isik { width: 460px; height: 560px; top: 56%; }
	.golge { bottom: 5%; width: 280px; }
	.nokta .kapsul { opacity: 1; }
	.nokta .kapsul { top: -46px; padding: 11px 22px 11px 26px; font-size: 15px; }
	.nokta.sol .kapsul { padding: 11px 26px 11px 22px; }
	.notlar { position: absolute; left: 9%; right: auto; bottom: auto; top: 54%; width: min(300px, 22vw); display: grid; justify-content: normal; padding-inline: 0; gap: 26px; opacity: 0; transition: opacity 0.9s var(--egri) 1.1s; }
	.notlar .not { background: none; backdrop-filter: none; -webkit-backdrop-filter: none; box-shadow: none; } .notlar .not::before { display: none; }
	.not .uz { display: inline; } .not .kisa { display: none; }
	.hazir .notlar { opacity: 1; }
	.not { display: grid; grid-template-columns: 52px 1fr; gap: 20px; align-items: center; height: auto; padding: 0; border-radius: 0; font-size: inherit; white-space: normal; }
	.not .simge { width: 52px; height: 52px; border-radius: 17px; display: grid; place-items: center; font-size: 23px; color: var(--buz); }
	.not p { margin: 0; text-align: right; color: var(--yazi-2); font-size: 15.5px; line-height: 1.4; }
	.sag-yazi { display: block; position: absolute; left: calc(47% + 310px); top: 68%; width: 220px; font-size: 15.5px; margin: 0; color: var(--yazi-2); font-size: 15.5px; line-height: 1.4; opacity: 0; transition: opacity 0.9s var(--egri) 1.3s; }
	.hazir .sag-yazi { opacity: 1; }
	.not-temsili { display: block; position: absolute; left: 9%; bottom: 7%; font-size: 12px; color: var(--yazi-3); }
	.al { right: auto; left: calc(47% + 150px); bottom: auto; top: 65%; width: 132px; height: 132px; gap: 6px; }
	.sahne:has(.urun.kare) .al { left: calc(47% + 220px); }
	.al .ti { font-size: 22px; } .al b { font-size: 26px; }
	.puskurt { right: auto; left: 9%; bottom: auto; top: 79%; height: 52px; font-size: 16px; padding: 0 22px 0 18px; }
	.duman { -webkit-mask-image: linear-gradient(90deg, transparent, #000 9%, #000 91%, transparent); mask-image: linear-gradient(90deg, transparent, #000 9%, #000 91%, transparent); }
	.boylar { left: auto; right: 4%; bottom: 7%; margin: 0; }
	.giris { display: none; }
}
@media (max-width: 359.98px) { .ust { grid-template-columns: minmax(50px, 1fr) auto minmax(50px, 1fr); } .ust .sag a { display: none; } .marka .ad { font-size: 16px; } .marka img { width: 24px; } }
@media (prefers-reduced-motion: reduce) {
	*, *::before, *::after { transition-duration: 0.01s !important; transition-delay: 0s !important; animation-duration: 0.01s !important; }
	::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
}

/* ───────── Kaptan sitesi (2026-10-11): cam daha hafif; kartlar sekme çubuğuyla aynı cam dilinde; derinlikli kartlar ─────────
   Kabarza "depth map" örneği: arka plan ve büyük yazı pencereye kırpılır, ürün kırpılmaz. İmleçle kart eğilir, katmanlar
   derinliklerine göre kayar; üstüne gelince ürün öne çıkıp pencerenin dışına taşar. */
.cam, .notlar .not { box-shadow: inset 1.5px 1.5px 0 -0.5px rgb(255 255 255 / 0.4), inset -1px -1px 0 rgb(255 255 255 / 0.06), inset 0 0 0 1px rgb(220 232 255 / 0.12),

// ── Kaydırdıkça açılma ──
// Ekrana giren öğeler aynı anda gelenler arasında sırayla belirir; başlıklar satır satır maskeden çıkar, ölçü sayıları sayarak gelir.
// Gizli hâl yalnız burada kurulur: gözlemci yoksa ya da "hareketi azalt" açıksa hiçbir şey gizlenmez.

	const son = el.textContent, hedef = parseFloat(m[1].replace(/\./g, '') + (m[2] ? '.' + m[2] : '')), ond = m[2]?.length ?? 0, t0 = performance.now();
	const yaz = (v) => (ond ? v.toFixed(ond).replace('.', ',') : String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, '.')) + m[3];
	(function adim(t) { const k = Math.min(1, (t - t0) / 1100), e = 1 - Math.pow(1 - k, 3); el.textContent = k < 1 ? yaz(hedef * e) : son; if (k < 1) requestAnimationFrame(adim); })(t0);
}
function belirle(liste, anahtar) {
	goz[anahtar]?.disconnect();
	if (azHareket || !('IntersectionObserver' in window)) return;
	const io = goz[anahtar] = new IntersectionObserver((girenler) => {
		const sirali = girenler.filter((g) => g.isIntersecting).sort((x, y) => (x.target.compareDocumentPosition(y.target) & Node.DOCUMENT_POSITION_FOLLOWING ? -1 : 1));
		sirali.forEach((g, k) => {
			const el = g.target; io.unobserve(el); const gec = Math.min(k, 6) * 110;
			el.style.setProperty('--g', gec + 'ms'); el.style.transitionDelay = gec + 'ms'; el.classList.add('gor');
			const sayi = el.matches('.olcu') && $(':scope > b', el); if (sayi) setTimeout(() => sayarakGel(sayi), gec + 320);
			setTimeout(() => { el.classList.remove('bk', 'hbk', 'gor'); el.style.removeProperty('--g'); el.style.transitionDelay = ''; delete el.dataset.v; }, 2800 + gec);
		});
	}, { rootMargin: '0px 0px -16% 0px', threshold: 0.1 });
	liste.forEach((x) => {
		const [el, v] = Array.isArray(x) ? x : [x, '']; if (v) el.dataset.v = v;
		if (v === 'baslik') { el.innerHTML = el.innerHTML.split('<br>').map((l, i) => `<span class="hs" style="--s:${i}">${[...l].map((c, n) => `<span class="hc" style="--c:${n}">${kacir(c)}</span>`).join('')}</span>`).join(''); el.classList.add('hbk'); }
		else el.classList.add('bk');
